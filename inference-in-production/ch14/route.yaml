# ch14/route.yaml
# Cache-aware: every request to the gateway goes to the pool, and
# the pool's endpoint picker chooses the replica.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: smollm2
spec:
  parentRefs:
  - name: inference-gateway
  rules:
  - backendRefs:
    - group: inference.networking.k8s.io
      kind: InferencePool
      name: smollm2
    timeouts:
      request: 300s
