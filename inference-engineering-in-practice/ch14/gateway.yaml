# ch14/gateway.yaml
# The Gateway. Istio sees the class, runs an Envoy for it, and
# (with the inference extension on) calls the pool's endpoint
# picker for every request routed to an InferencePool.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: inference-gateway
  annotations:
    networking.istio.io/service-type: ClusterIP
spec:
  gatewayClassName: istio
  listeners:
  - name: http
    port: 80
    protocol: HTTP
---
# Lab plumbing: the runner reaches the gateway on the node's port
# 30080 (http://ch14-control-plane:30080).
apiVersion: v1
kind: Service
metadata:
  name: inference-gateway-nodeport
spec:
  type: NodePort
  selector:
    gateway.networking.k8s.io/gateway-name: inference-gateway
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
