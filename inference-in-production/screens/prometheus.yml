# Skeleton for the capture stack (compose profile `screens`) and ch15.
# It scrapes the lab servers by the names lib/lab.sh gives them on
# the lab network; a target is simply "down" while no lab runs it.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: llama
    static_configs:
      - targets: ["llama:8080"]
  - job_name: vllm
    static_configs:
      - targets: ["vllm:8000"]
