# ch18/canary-route.yaml
# Blue-green for a serving change: the candidate is a second, whole
# InferencePool (its own replicas and endpoint picker), and the
# route's weights move traffic 1 -> 5 -> 10 -> 50 -> 100 percent.
# Rolling back is setting the weights back.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: smollm2
spec:
  parentRefs:
  - name: inference-gateway
  rules:
  - backendRefs:
    - group: inference.networking.k8s.io
      kind: InferencePool
      name: smollm2-stable
      weight: 95
    - group: inference.networking.k8s.io
      kind: InferencePool
      name: smollm2-canary
      weight: 5
    timeouts:
      request: 300s
