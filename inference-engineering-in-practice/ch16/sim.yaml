# ch16/sim.yaml
# The pool KEDA scales: llm-d-inference-sim replicas (simulated).
# Each runs 4 requests at once and queues the rest; the queue is
# what vllm:num_requests_waiting counts. A new replica reports ready
# 20 s after it starts (--startup-duration), the simulator's stand-in
# for loading weights. Every timing is its configuration.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smollm2-sim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smollm2-sim
  template:
    metadata:
      labels:
        app: smollm2-sim
    spec:
      containers:
      - name: sim
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.11.2
        args:
        - --model=smollm2-360m
        - --port=8000
        - --mode=random
        - --max-model-len=8192
        - --max-num-seqs=4
        - --latency-calculator=per-token
        - --prefill-overhead=20ms
        - --prefill-time-per-token=1ms
        - --inter-token-latency=20ms
        - --startup-duration=20s
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet: {path: /health/ready, port: 8000}
          periodSeconds: 2
---
# Traffic enters here, on the node's port 30080.
apiVersion: v1
kind: Service
metadata:
  name: smollm2-sim
spec:
  type: NodePort
  selector:
    app: smollm2-sim
  ports:
  - port: 8000
    nodePort: 30080
---
# One DNS record per ready replica, for Prometheus to scrape.
apiVersion: v1
kind: Service
metadata:
  name: smollm2-sim-pods
spec:
  clusterIP: None
  selector:
    app: smollm2-sim
  ports:
  - port: 8000
