# ch14/sim.yaml
# Three llm-d-inference-sim replicas stand in for vLLM. Every timing
# here is the simulator's configuration, not a measurement: prefill
# costs 1 ms per uncached prompt token plus 20 ms, decode 20 ms per
# token, and a replica runs at most 4 requests at once. The
# simulated prefix cache counts hits the way vLLM's does.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smollm2-sim
spec:
  replicas: 3
  selector:
    matchLabels:
      app: smollm2-sim
  template:
    metadata:
      labels:
        app: smollm2-sim
    spec:
      containers:
      - name: sim
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.11.2
        args:
        - --model=smollm2-360m
        - --port=8000
        - --mode=random
        - --max-model-len=8192
        - --max-num-seqs=4
        - --enable-kvcache=true
        - --kv-cache-size=4096
        - --block-size=16
        - --latency-calculator=per-token
        - --prefill-overhead=20ms
        - --prefill-time-per-token=1ms
        - --inter-token-latency=20ms
        env:
        - name: POD_NAME          # echoed as x-inference-pod
          valueFrom:
            fieldRef: {fieldPath: metadata.name}
        - name: POD_IP
          valueFrom:
            fieldRef: {fieldPath: status.podIP}
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet: {path: /health, port: 8000}
          periodSeconds: 2
---
# A plain Service over the same pods, for the cache-blind route.
apiVersion: v1
kind: Service
metadata:
  name: smollm2-sim
spec:
  selector:
    app: smollm2-sim
  ports:
  - port: 8000
