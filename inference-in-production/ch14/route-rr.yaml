# ch14/route-rr.yaml
# Cache-blind: the same route with one change, a plain Service as
# the backend, which the gateway round-robins across the replicas.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: smollm2
spec:
  parentRefs:
  - name: inference-gateway
  rules:
  - backendRefs:
    - kind: Service
      name: smollm2-sim
      port: 8000
    timeouts:
      request: 300s
---
# Set the balancing policy explicitly: round-robin, cache-blind.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: smollm2-sim-round-robin
spec:
  host: smollm2-sim.default.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
